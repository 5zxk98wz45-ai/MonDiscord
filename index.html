<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MonDiscord</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #1e1f22; color: #dbdee1; overflow: hidden; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* --- Auth --- */
  #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 16px; gap: 14px; text-align: center; }
  #auth-screen h1 { font-size: 28px; margin-bottom: 4px; background: linear-gradient(90deg,#5865f2,#eb459e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #auth-box { background: #2b2d31; padding: 24px; border-radius: 12px; width: 100%; max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #auth-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #1e1f22; background: #1e1f22; color: white; font-size: 16px; }
  #auth-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #5865f2; color: white; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 4px; }
  #auth-toggle { color: #949ba4; font-size: 13px; margin-top: 12px; cursor: pointer; }
  #auth-toggle b { color: #00a8fc; }
  #auth-error { color: #f23f42; font-size: 13px; min-height: 18px; }

  /* --- App --- */
  #app { display: flex; height: 100vh; }

  #server-rail { width: 64px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; overflow-y: auto; }
  .server-icon, .add-icon {
    width: 44px; height: 44px; border-radius: 50%; background: #313338; color: #dbdee1;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
    cursor: pointer; transition: border-radius .15s, background .15s; text-transform: uppercase; flex-shrink: 0;
  }
  .server-icon:hover, .server-icon.active { border-radius: 14px; background: #5865f2; }
  .add-icon { background: #23a55a; font-size: 20px; }
  .add-icon:hover { border-radius: 14px; }

  #mid-column { width: 200px; background: #2b2d31; display: flex; flex-direction: column; flex-shrink: 0; }
  #server-title { padding: 12px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #1e1f22; }

  #channel-list-wrap { padding: 8px; }
  #channel-list-wrap h3, #contacts-wrap h3 { font-size: 11px; text-transform: uppercase; color: #949ba4; margin: 6px 4px; display: flex; justify-content: space-between; align-items: center; }
  .small-add-btn { background: none; border: none; color: #949ba4; font-size: 16px; cursor: pointer; padding: 0 4px; }
  #channel-list { list-style: none; padding: 0; margin: 0; }
  #channel-list li { padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #949ba4; margin-bottom: 2px; }
  #channel-list li:hover { background: #35373c; color: #dbdee1; }
  #channel-list li.active { background: #404249; color: white; }

  #user-list-wrap { padding: 8px; overflow-y: auto; flex: 1; min-height: 0; }
  #user-list { list-style: none; padding: 0; margin: 0; }
  #user-list li, #contact-list li { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; margin-bottom: 2px; font-size: 14px; }
  #contact-list li { cursor: pointer; }
  #contact-list li:hover { background: #35373c; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
  .dot.online { background: #23a55a; } .dot.offline { background: #6b6e76; }

  #contacts-wrap { padding: 8px; border-top: 1px solid #1e1f22; }
  #add-contact-row { display: flex; gap: 4px; margin-bottom: 6px; }
  #add-contact-input { flex: 1; padding: 8px; border-radius: 6px; border: none; background: #1e1f22; color: white; font-size: 14px; min-width: 0; }
  #add-contact-btn { padding: 8px 10px; border: none; border-radius: 6px; background: #5865f2; color: white; cursor: pointer; font-size: 13px; }
  #contact-list { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; }

  #call-bar { padding: 8px; border-top: 1px solid #1e1f22; }
  #call-bar button { width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
  #join-call-btn { background: #23a55a; color: white; }
  #leave-call-btn { background: #da373c; color: white; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #no-channel { flex: 1; display: flex; align-items: center; justify-content: center; color: #6b6e76; padding: 20px; text-align: center; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin-bottom: 10px; display: flex; gap: 8px; }
  .msg .content .pseudo { font-weight: 700; font-size: 14px; margin-right: 6px; }
  .msg .content .text { font-size: 14px; word-break: break-word; }
  .system-msg { color: #949ba4; font-style: italic; font-size: 13px; margin-bottom: 6px; }
  .error-msg { color: #f23f42; font-size: 13px; margin-bottom: 6px; }

  #chat-form { display: flex; gap: 8px; padding: 12px; flex-shrink: 0; }
  #chat-input { flex: 1; padding: 12px 14px; border-radius: 8px; border: none; background: #383a40; color: white; font-size: 16px; min-width: 0; }
  #chat-form button { padding: 10px 16px; border: none; border-radius: 8px; background: #5865f2; color: white; cursor: pointer; }

  #call-panel { position: fixed; top: 8px; right: 8px; left: 8px; max-width: 420px; margin-left: auto; background: #111214; padding: 10px; border-radius: 12px; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; margin-bottom: 8px; }
  #videos-grid video { width: 100%; border-radius: 8px; background: #000; display: block; aspect-ratio: 4/3; object-fit: cover; }
  #call-panel > button { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #da373c; color: white; font-weight: 600; }

  /* --- Modales simples --- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 30; }
  .modal-box { background: #2b2d31; padding: 20px; border-radius: 10px; width: 260px; }
  .modal-box h3 { margin: 0 0 10px; font-size: 15px; }
  .modal-box input { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1e1f22; color: white; margin-bottom: 10px; font-size: 16px; }
  .modal-box .row { display: flex; gap: 8px; }
  .modal-box button { flex: 1; padding: 9px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .modal-confirm { background: #5865f2; color: white; }
  .modal-cancel { background: #4e5058; color: white; }

  @media (max-width: 560px) {
    #mid-column { width: 130px; }
    #server-rail { width: 52px; }
    .server-icon, .add-icon { width: 36px; height: 36px; font-size: 11px; }
  }
</style>
</head>
<body>

  <div id="auth-screen">
    <h1>MonDiscord</h1>
    <div id="auth-box">
      <input id="pseudo-input" placeholder="Pseudo" maxlength="20" autocomplete="username">
      <input id="password-input" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <div id="auth-error"></div>
      <button id="auth-submit-btn">Se connecter</button>
      <div id="auth-toggle">Pas de compte ? <b>Inscris-toi</b></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div id="server-rail"></div>

    <div id="mid-column">
      <div id="server-title">Choisis ou crée un serveur</div>

      <div id="channel-list-wrap">
        <h3>Salons <button class="small-add-btn" id="add-channel-btn">＋</button></h3>
        <ul id="channel-list"></ul>
      </div>

      <div id="user-list-wrap">
        <h3>En ligne ici</h3>
        <ul id="user-list"></ul>
      </div>

      <div id="contacts-wrap">
        <h3>Contacts</h3>
        <div id="add-contact-row">
          <input id="add-contact-input" placeholder="Pseudo...">
          <button id="add-contact-btn">Ajouter</button>
        </div>
        <ul id="contact-list"></ul>
      </div>

      <div id="call-bar">
        <button id="join-call-btn" class="hidden">🎙️ Rejoindre l'appel</button>
        <button id="leave-call-btn" class="hidden">📞 Quitter l'appel</button>
      </div>
    </div>

    <div id="main">
      <div id="no-channel">Sélectionne ou crée un serveur, puis un salon, pour discuter.</div>
      <div id="chat-messages" class="hidden"></div>
      <form id="chat-form" class="hidden">
        <input id="chat-input" placeholder="Écris un message..." autocomplete="off">
        <button type="submit">Envoyer</button>
      </form>
    </div>
  </div>

  <div id="call-panel" class="hidden">
    <div id="videos-grid"></div>
    <button id="hangup-btn">Raccrocher</button>
  </div>

  <div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const SERVER_URL = 'https://mondiscord.onrender.com';
  const socket = io(SERVER_URL);

  // --- DOM ---
  const authScreen = document.getElementById('auth-screen');
  const pseudoInput = document.getElementById('pseudo-input');
  const passwordInput = document.getElementById('password-input');
  const authError = document.getElementById('auth-error');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authToggle = document.getElementById('auth-toggle');

  const app = document.getElementById('app');
  const serverRail = document.getElementById('server-rail');
  const serverTitle = document.getElementById('server-title');
  const channelList = document.getElementById('channel-list');
  const addChannelBtn = document.getElementById('add-channel-btn');
  const userListEl = document.getElementById('user-list');
  const addContactInput = document.getElementById('add-contact-input');
  const addContactBtn = document.getElementById('add-contact-btn');
  const contactListEl = document.getElementById('contact-list');

  const noChannelEl = document.getElementById('no-channel');
  const chatMessages = document.getElementById('chat-messages');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');

  const joinCallBtn = document.getElementById('join-call-btn');
  const leaveCallBtn = document.getElementById('leave-call-btn');
  const callPanel = document.getElementById('call-panel');
  const videosGrid = document.getElementById('videos-grid');
  const hangupBtn = document.getElementById('hangup-btn');
  const modalRoot = document.getElementById('modal-root');

  let mode = 'login';
  let myPseudo = '';
  let allServers = [];
  let currentServerId = null;
  let currentChannelId = null;
  let inCall = false;
  let localStream = null;
  const peerConnections = {};       // appel de groupe (mesh) : socketId -> RTCPeerConnection
  let directPC = null;              // appel direct 1-à-1 avec un contact
  let directLocalStream = null;
  let directPartnerId = null;
  let pendingDirectOffer = null;
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function colorFor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return `hsl(${Math.abs(hash) % 360}, 60%, 45%)`;
  }
  function avatarEl(pseudo) {
    const div = document.createElement('div');
    div.className = 'avatar';
    div.style.background = colorFor(pseudo);
    div.textContent = pseudo.slice(0, 2).toUpperCase();
    return div;
  }
  function showMessage(text, cls) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // --- Petite modale texte réutilisable ---
  function promptModal(title, placeholder, onConfirm) {
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <h3>${title}</h3>
          <input id="modal-input" placeholder="${placeholder}" maxlength="30">
          <div class="row">
            <button class="modal-cancel" id="modal-cancel">Annuler</button>
            <button class="modal-confirm" id="modal-confirm">OK</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('modal-input');
    input.focus();
    document.getElementById('modal-cancel').onclick = () => modalRoot.innerHTML = '';
    const confirm = () => {
      const val = input.value.trim();
      if (!val) return;
      modalRoot.innerHTML = '';
      onConfirm(val);
    };
    document.getElementById('modal-confirm').onclick = confirm;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirm(); });
  }

  // --- Auth ---
  authToggle.onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    authSubmitBtn.textContent = mode === 'login' ? 'Se connecter' : "S'inscrire";
    authToggle.innerHTML = mode === 'login' ? "Pas de compte ? <b>Inscris-toi</b>" : "Déjà un compte ? <b>Connecte-toi</b>";
    authError.textContent = '';
  };

  authSubmitBtn.onclick = () => {
    const pseudo = pseudoInput.value.trim();
    const password = passwordInput.value;
    if (!pseudo || !password) { authError.textContent = 'Remplis les deux champs.'; return; }
    authError.textContent = '';
    socket.emit(mode, { pseudo, password }, (res) => {
      if (!res.ok) { authError.textContent = res.error; return; }
      if (mode === 'register') {
        authError.style.color = '#23a55a';
        authError.textContent = 'Compte créé ! Connecte-toi maintenant.';
        setTimeout(() => authError.style.color = '#f23f42', 10);
        mode = 'login';
        authSubmitBtn.textContent = 'Se connecter';
        authToggle.innerHTML = "Pas de compte ? <b>Inscris-toi</b>";
        return;
      }
      myPseudo = pseudo;
      authScreen.classList.add('hidden');
      app.classList.remove('hidden');
      socket.emit('join', myPseudo);
      renderContacts();
    });
  };
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmitBtn.click(); });

  // --- Liste des serveurs ---
  socket.on('servers-list', (list) => {
    allServers = list;
    serverRail.innerHTML = '';
    list.forEach((s) => {
      const div = document.createElement('div');
      div.className = 'server-icon' + (s.id === currentServerId ? ' active' : '');
      div.textContent = s.name.slice(0, 2);
      div.title = s.name;
      div.onclick = () => selectServer(s.id);
      serverRail.appendChild(div);
    });
    const addDiv = document.createElement('div');
    addDiv.className = 'add-icon';
    addDiv.textContent = '+';
    addDiv.title = 'Créer un serveur';
    addDiv.onclick = () => promptModal('Créer un serveur', 'Nom du serveur', (name) => {
      socket.emit('create-server', name, (res) => {
        if (res.ok) selectServer(res.id);
      });
    });
    serverRail.appendChild(addDiv);

    // Rafraîchit la vue du salon courant si son serveur a changé (ex: nouveau salon ajouté)
    if (currentServerId) renderChannelList();
  });

  function selectServer(serverId) {
    currentServerId = serverId;
    currentChannelId = null;
    const s = allServers.find((x) => x.id === serverId);
    serverTitle.textContent = s ? s.name : '';
    renderChannelList();
    showNoChannel();
    document.querySelectorAll('.server-icon').forEach((el, i) => el.classList.toggle('active', allServers[i]?.id === serverId));
  }

  function renderChannelList() {
    const s = allServers.find((x) => x.id === currentServerId);
    channelList.innerHTML = '';
    if (!s) return;
    s.channels.forEach((c) => {
      const li = document.createElement('li');
      li.textContent = '# ' + c.name;
      li.className = c.id === currentChannelId ? 'active' : '';
      li.onclick = () => joinChannel(s.id, c.id);
      channelList.appendChild(li);
    });
  }

  addChannelBtn.onclick = () => {
    if (!currentServerId) { showMessage('Choisis ou crée un serveur avant.', 'error-msg'); return; }
    promptModal('Créer un salon', 'Nom du salon', (name) => {
      socket.emit('create-channel', { serverId: currentServerId, name }, (res) => {
        if (!res.ok) alert(res.error);
      });
    });
  };

  function joinChannel(serverId, channelId) {
    if (inCall) leaveCall();
    socket.emit('join-channel', { serverId, channelId });
  }

  socket.on('channel-joined', ({ serverId, channelId }) => {
    currentServerId = serverId; currentChannelId = channelId;
    renderChannelList();
    chatMessages.innerHTML = '';
    showChannelUI();
  });

  function showNoChannel() {
    noChannelEl.classList.remove('hidden');
    chatMessages.classList.add('hidden');
    chatForm.classList.add('hidden');
    joinCallBtn.classList.add('hidden');
    leaveCallBtn.classList.add('hidden');
  }
  function showChannelUI() {
    noChannelEl.classList.add('hidden');
    chatMessages.classList.remove('hidden');
    chatForm.classList.remove('hidden');
    if (!inCall) joinCallBtn.classList.remove('hidden');
  }

  socket.on('user-list', (list) => {
    userListEl.innerHTML = '';
    list.forEach((pseudo) => {
      const li = document.createElement('li');
      li.appendChild(avatarEl(pseudo));
      li.appendChild(document.createTextNode(pseudo));
      userListEl.appendChild(li);
    });
  });

  // --- Chat ---
  chatForm.onsubmit = (e) => {
    e.preventDefault();
    const msg = chatInput.value.trim();
    if (!msg) return;
    socket.emit('chat-message', msg);
    chatInput.value = '';
  };
  socket.on('chat-message', ({ pseudo, msg }) => {
    const div = document.createElement('div');
    div.className = 'msg';
    div.appendChild(avatarEl(pseudo));
    const content = document.createElement('div');
    content.className = 'content';
    const p = document.createElement('span'); p.className = 'pseudo'; p.textContent = pseudo;
    const t = document.createElement('span'); t.className = 'text'; t.textContent = msg;
    content.appendChild(p); content.appendChild(document.createElement('br')); content.appendChild(t);
    div.appendChild(content);
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  // --- Contacts (juste ajoutés, pas d'appel automatique) ---
  function getContacts() {
    try { return JSON.parse(localStorage.getItem('mondiscord-contacts') || '[]'); } catch { return []; }
  }
  function saveContacts(list) { localStorage.setItem('mondiscord-contacts', JSON.stringify(list)); }

  addContactBtn.onclick = () => {
    const pseudo = addContactInput.value.trim();
    if (!pseudo || pseudo === myPseudo) return;
    const list = getContacts();
    if (!list.includes(pseudo)) { list.push(pseudo); saveContacts(list); }
    addContactInput.value = '';
    renderContacts();
  };
  addContactInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addContactBtn.click(); });

  function renderContacts() {
    const contacts = getContacts();
    if (contacts.length === 0) { contactListEl.innerHTML = ''; return; }
    socket.emit('check-online', contacts, (online) => {
      contactListEl.innerHTML = '';
      contacts.forEach((pseudo) => {
        const isOnline = online.includes(pseudo);
        const li = document.createElement('li');
        li.appendChild(avatarEl(pseudo));
        li.appendChild(document.createTextNode(pseudo));
        const dot = document.createElement('span');
        dot.className = 'dot ' + (isOnline ? 'online' : 'offline');
        li.appendChild(dot);
        li.onclick = () => { if (isOnline) startDirectCall(pseudo); else showMessage(`${pseudo} n'est pas en ligne.`, 'system-msg'); };
        contactListEl.appendChild(li);
      });
    });
  }
  setInterval(() => { if (myPseudo) renderContacts(); }, 8000);

  // --- Appel de groupe (mesh) ---
  async function getLocalMedia() {
    try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); }
    catch {
      try { showMessage('Caméra indisponible, audio seul.', 'error-msg'); return await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
      catch (e) { showMessage("Impossible d'accéder au micro/caméra.", 'error-msg'); throw e; }
    }
  }
  function addVideoTile(id, stream, isLocal) {
    let video = document.getElementById('video-' + id);
    if (!video) {
      video = document.createElement('video');
      video.id = 'video-' + id; video.autoplay = true; video.playsInline = true;
      if (isLocal) video.muted = true;
      videosGrid.appendChild(video);
    }
    video.srcObject = stream;
  }
  function removeVideoTile(id) { const v = document.getElementById('video-' + id); if (v) v.remove(); }

  function createPeerConnection(remoteId) {
    const pc = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    pc.ontrack = (e) => addVideoTile(remoteId, e.streams[0], false);
    pc.onicecandidate = (e) => { if (e.candidate) socket.emit('ice-candidate', { to: remoteId, candidate: e.candidate }); };
    peerConnections[remoteId] = pc;
    return pc;
  }

  joinCallBtn.onclick = async () => {
    try { localStream = await getLocalMedia(); } catch { return; }
    inCall = true;
    callPanel.classList.remove('hidden');
    joinCallBtn.classList.add('hidden');
    leaveCallBtn.classList.remove('hidden');
    addVideoTile('local', localStream, true);
    socket.emit('join-call');
  };

  socket.on('existing-call-peers', async (peers) => {
    for (const { id } of peers) {
      const pc = createPeerConnection(id);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('call-offer', { to: id, offer });
    }
  });
  socket.on('call-offer', async ({ from, offer }) => {
    if (!inCall) return;
    const pc = createPeerConnection(from);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('call-answer', { to: from, answer });
  });
  socket.on('call-answer', async ({ from, answer }) => { const pc = peerConnections[from]; if (pc) await pc.setRemoteDescription(answer); });
  socket.on('ice-candidate', async ({ from, candidate }) => { const pc = peerConnections[from]; if (pc) { try { await pc.addIceCandidate(candidate); } catch {} } });
  socket.on('call-peer-left', ({ id }) => { if (peerConnections[id]) { peerConnections[id].close(); delete peerConnections[id]; } removeVideoTile(id); });

  function leaveCall() {
    socket.emit('leave-call');
    Object.values(peerConnections).forEach((pc) => pc.close());
    Object.keys(peerConnections).forEach((id) => delete peerConnections[id]);
    videosGrid.innerHTML = '';
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
    inCall = false;
    callPanel.classList.add('hidden');
    if (currentChannelId) joinCallBtn.classList.remove('hidden');
    leaveCallBtn.classList.add('hidden');
  }
  leaveCallBtn.onclick = leaveCall;
  hangupBtn.onclick = () => { if (inCall) leaveCall(); if (directPC) endDirectCall(); };

  // --- Appel direct 1-à-1 avec un contact ---
  async function startDirectCall(targetPseudo) {
    if (directPC || inCall) { showMessage('Un appel est déjà en cours.', 'error-msg'); return; }
    try { directLocalStream = await getLocalMedia(); } catch { return; }
    callPanel.classList.remove('hidden');
    addVideoTile('local', directLocalStream, true);

    directPC = new RTCPeerConnection(rtcConfig);
    directLocalStream.getTracks().forEach((t) => directPC.addTrack(t, directLocalStream));
    directPC.ontrack = (e) => addVideoTile('remote', e.streams[0], false);
    directPC.onicecandidate = (e) => { if (e.candidate) socket.emit('direct-ice-candidate', { to: directPartnerId, candidate: e.candidate }); };

    const offer = await directPC.createOffer();
    await directPC.setLocalDescription(offer);
    socket.emit('direct-call-user', { toPseudo: targetPseudo, offer }, (res) => {
      if (!res || !res.ok) {
        showMessage(`${targetPseudo} n'est plus en ligne.`, 'error-msg');
        endDirectCall();
        return;
      }
      directPartnerId = res.targetId;
    });
  }

  socket.on('direct-incoming-call', ({ from, offer, pseudo }) => {
    if (directPC || inCall) { socket.emit('direct-end-call', { to: from }); return; }
    pendingDirectOffer = { from, offer };
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <h3>Appel entrant de ${pseudo}</h3>
          <div class="row">
            <button class="modal-cancel" id="reject-direct">Refuser</button>
            <button class="modal-confirm" id="accept-direct">Accepter</button>
          </div>
        </div>
      </div>`;
    document.getElementById('reject-direct').onclick = () => { modalRoot.innerHTML = ''; socket.emit('direct-end-call', { to: from }); pendingDirectOffer = null; };
    document.getElementById('accept-direct').onclick = async () => {
      modalRoot.innerHTML = '';
      directPartnerId = from;
      try { directLocalStream = await getLocalMedia(); } catch { pendingDirectOffer = null; return; }
      callPanel.classList.remove('hidden');
      addVideoTile('local', directLocalStream, true);

      directPC = new RTCPeerConnection(rtcConfig);
      directLocalStream.getTracks().forEach((t) => directPC.addTrack(t, directLocalStream));
      directPC.ontrack = (e) => addVideoTile('remote', e.streams[0], false);
      directPC.onicecandidate = (e) => { if (e.candidate) socket.emit('direct-ice-candidate', { to: from, candidate: e.candidate }); };

      await directPC.setRemoteDescription(pendingDirectOffer.offer);
      const answer = await directPC.createAnswer();
      await directPC.setLocalDescription(answer);
      socket.emit('direct-answer-call', { to: from, answer });
      pendingDirectOffer = null;
    };
  });
  socket.on('direct-call-answered', async ({ from, answer }) => { if (directPC) await directPC.setRemoteDescription(answer); });
  socket.on('direct-ice-candidate', async ({ candidate }) => { if (directPC) { try { await directPC.addIceCandidate(candidate); } catch {} } });
  socket.on('direct-call-ended', () => endDirectCall());

  function endDirectCall() {
    if (directPC) { directPC.close(); directPC = null; }
    if (directLocalStream) { directLocalStream.getTracks().forEach((t) => t.stop()); directLocalStream = null; }
    removeVideoTile('remote');
    if (!inCall) { removeVideoTile('local'); callPanel.classList.add('hidden'); }
    directPartnerId = null;
  }
  hangupBtn.addEventListener('click', () => { if (directPartnerId) socket.emit('direct-end-call', { to: directPartnerId }); });
</script>
</body>
