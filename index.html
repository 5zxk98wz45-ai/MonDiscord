<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>MonDiscord</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    html, body { margin: 0; background: #313338; color: #dcddde; height: 100%; overflow: hidden; }
    .hidden { display: none !important; }

    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 12px; padding: 16px;
    }
    #login-screen input, #login-screen button { padding: 12px; border-radius: 6px; border: none; font-size: 16px; width: 240px; }
    #login-screen button { background: #5865f2; color: white; cursor: pointer; }

    #app { display: flex; flex-direction: column; height: 100vh; }
    #topbar { display: flex; gap: 8px; padding: 10px; background: #2b2d31; align-items: center; }
    #topbar input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #1e1f22; color: white; font-size: 16px; min-width: 0; }
    #add-btn { padding: 10px 14px; border: none; border-radius: 6px; background: #23a55a; color: white; cursor: pointer; white-space: nowrap; }

    #body-row { display: flex; flex: 1; min-height: 0; }
    #sidebar { width: 160px; background: #2b2d31; padding: 12px; overflow-y: auto; flex-shrink: 0; }
    #sidebar h2 { font-size: 12px; text-transform: uppercase; color: #949ba4; margin: 8px 0 4px; }
    #user-list, #friend-list { list-style: none; padding: 0; margin: 0; }
    #user-list li, #friend-list li {
      padding: 8px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; font-size: 14px;
      display: flex; align-items: center; gap: 6px; word-break: break-word;
    }
    #user-list li:hover, #friend-list li:hover { background: #3a3c41; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: #23a55a; }
    .dot.offline { background: #6b6e76; }

    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin-bottom: 8px; word-break: break-word; }
    .msg .pseudo { font-weight: bold; color: #5865f2; margin-right: 6px; }
    .system-msg { color: #949ba4; font-style: italic; font-size: 13px; }
    .error-msg { color: #f23f42; font-size: 13px; }

    #chat-form { display: flex; padding: 10px; gap: 8px; background: #383a40; flex-shrink: 0; }
    #chat-input { flex: 1; padding: 12px; border-radius: 6px; border: none; background: #1e1f22; color: white; font-size: 16px; min-width: 0; }
    #chat-form button { padding: 10px 16px; border: none; border-radius: 6px; background: #5865f2; color: white; cursor: pointer; }

    #call-panel {
      position: fixed; top: 8px; right: 8px; left: 8px; background: #1e1f22; padding: 10px;
      border-radius: 8px; z-index: 10; max-width: 260px; margin-left: auto;
    }
    #call-panel video { width: 100%; max-width: 220px; border-radius: 6px; margin-bottom: 6px; display: block; background: #000; }
    #hangup-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; background: #da373c; color: white; }

    #incoming-call {
      position: fixed; bottom: 12px; left: 8px; right: 8px; background: #1e1f22; padding: 14px;
      border-radius: 8px; z-index: 20; text-align: center;
    }
    #incoming-call p { margin: 0 0 10px; }
    #incoming-call button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; margin: 0 6px; }
    #accept-call-btn { background: #23a55a; color: white; }
    #reject-call-btn { background: #da373c; color: white; }

    @media (max-width: 480px) {
      #sidebar { width: 110px; }
      #topbar input { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>MonDiscord</h1>
    <input id="pseudo-input" placeholder="Choisis un pseudo" maxlength="20">
    <button id="join-btn">Rejoindre</button>
  </div>

  <div id="app" class="hidden">
    <div id="topbar">
      <input id="target-input" placeholder="Pseudo à appeler...">
      <button id="add-btn">Appeler</button>
    </div>

    <div id="body-row">
      <aside id="sidebar">
        <h2>En ligne</h2>
        <ul id="user-list"></ul>
        <h2>Mes contacts</h2>
        <ul id="friend-list"></ul>
      </aside>

      <main id="main">
        <div id="chat-messages"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="Écris un message..." autocomplete="off">
          <button type="submit">Envoyer</button>
        </form>
      </main>
    </div>
  </div>

  <div id="call-panel" class="hidden">
    <video id="local-video" autoplay muted playsinline></video>
    <video id="remote-video" autoplay playsinline></video>
    <button id="hangup-btn">Raccrocher</button>
  </div>

  <div id="incoming-call" class="hidden">
    <p id="caller-name"></p>
    <button id="accept-call-btn">Accepter</button>
    <button id="reject-call-btn">Refuser</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const SERVER_URL = 'https://mondiscord.onrender.com';
    const socket = io(SERVER_URL);

    const loginScreen = document.getElementById('login-screen');
    const app = document.getElementById('app');
    const pseudoInput = document.getElementById('pseudo-input');
    const joinBtn = document.getElementById('join-btn');
    const targetInput = document.getElementById('target-input');
    const addBtn = document.getElementById('add-btn');
    const userListEl = document.getElementById('user-list');
    const friendListEl = document.getElementById('friend-list');
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const callPanel = document.getElementById('call-panel');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const hangupBtn = document.getElementById('hangup-btn');
    const incomingCallEl = document.getElementById('incoming-call');
    const callerNameEl = document.getElementById('caller-name');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const rejectCallBtn = document.getElementById('reject-call-btn');

    let myPseudo = '';
    let peerConnection = null;
    let localStream = null;
    let currentCallPartner = null;
    let pendingOffer = null;
    let onlineUsers = [];

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // --- Contacts enregistrés (sauvegardés sur cet appareil) ---
    function getFriends() {
      try { return JSON.parse(localStorage.getItem('mondiscord-friends') || '[]'); }
      catch { return []; }
    }
    function saveFriends(list) {
      localStorage.setItem('mondiscord-friends', JSON.stringify(list));
    }
    function addFriend(pseudo) {
      const list = getFriends();
      if (!list.includes(pseudo)) { list.push(pseudo); saveFriends(list); }
      renderFriendList();
    }
    function renderFriendList() {
      friendListEl.innerHTML = '';
      getFriends().forEach((pseudo) => {
        if (pseudo === myPseudo) return;
        const isOnline = onlineUsers.includes(pseudo);
        const li = document.createElement('li');
        li.innerHTML = `<span class="dot ${isOnline ? 'online' : 'offline'}"></span>${pseudo}`;
        li.onclick = () => { if (isOnline) startCall(pseudo); else showSystemMessage(`${pseudo} n'est pas en ligne actuellement.`); };
        friendListEl.appendChild(li);
      });
    }

    function showSystemMessage(text, isError) {
      const div = document.createElement('div');
      div.className = isError ? 'error-msg' : 'system-msg';
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // --- Connexion ---
    joinBtn.onclick = () => {
      myPseudo = pseudoInput.value.trim();
      if (!myPseudo) return;
      socket.emit('join', myPseudo);
      loginScreen.classList.add('hidden');
      app.classList.remove('hidden');
      renderFriendList();
    };
    pseudoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

    socket.on('user-list', (list) => {
      onlineUsers = list;
      userListEl.innerHTML = '';
      list.forEach((pseudo) => {
        if (pseudo === myPseudo) return;
        const li = document.createElement('li');
        li.innerHTML = `<span class="dot online"></span>${pseudo}`;
        li.onclick = () => startCall(pseudo);
        userListEl.appendChild(li);
      });
      renderFriendList();
    });

    socket.on('system-message', (text) => showSystemMessage(text));

    // --- Appeler un pseudo tapé manuellement (+ l'ajoute aux contacts) ---
    addBtn.onclick = () => {
      const target = targetInput.value.trim();
      if (!target) return;
      addFriend(target);
      if (onlineUsers.includes(target)) {
        startCall(target);
      } else {
        showSystemMessage(`${target} a été ajouté à tes contacts, mais n'est pas en ligne actuellement.`);
      }
      targetInput.value = '';
    };
    targetInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addBtn.click(); });

    // --- Chat texte ---
    chatForm.onsubmit = (e) => {
      e.preventDefault();
      const msg = chatInput.value.trim();
      if (!msg) return;
      socket.emit('chat-message', msg);
      chatInput.value = '';
    };

    socket.on('chat-message', ({ pseudo, msg }) => {
      const div = document.createElement('div');
      div.className = 'msg';
      const pseudoSpan = document.createElement('span');
      pseudoSpan.className = 'pseudo';
      pseudoSpan.textContent = pseudo;
      div.appendChild(pseudoSpan);
      div.appendChild(document.createTextNode(msg));
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // --- Appels WebRTC ---
    async function getLocalMedia() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      } catch (err) {
        // Sur certains téléphones, la vidéo peut échouer : on retente en audio seul
        try {
          showSystemMessage('Caméra indisponible, tentative en audio seul...', true);
          return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } catch (err2) {
          showSystemMessage("Impossible d'accéder au micro/caméra. Vérifie les autorisations de ton navigateur.", true);
          throw err2;
        }
      }
    }

    async function startCall(targetPseudo) {
      if (peerConnection) { showSystemMessage('Un appel est déjà en cours.', true); return; }
      currentCallPartner = targetPseudo;
      try {
        localStream = await getLocalMedia();
      } catch { currentCallPartner = null; return; }

      localVideo.srcObject = localStream;
      callPanel.classList.remove('hidden');

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach((track) => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit('ice-candidate', { to: currentCallPartner, candidate: event.candidate });
      };
      peerConnection.onconnectionstatechange = () => {
        if (['failed', 'disconnected'].includes(peerConnection.connectionState)) {
          showSystemMessage('La connexion d\'appel a été perdue.', true);
          endCall();
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call-user', { to: currentCallPartner, offer });
    }

    socket.on('incoming-call', ({ from, offer, pseudo }) => {
      if (peerConnection) { socket.emit('end-call', { to: from }); return; } // déjà en appel
      pendingOffer = { from, offer };
      callerNameEl.textContent = `Appel entrant de ${pseudo}`;
      incomingCallEl.classList.remove('hidden');
    });

    acceptCallBtn.onclick = async () => {
      incomingCallEl.classList.add('hidden');
      currentCallPartner = pendingOffer.from;

      try {
        localStream = await getLocalMedia();
      } catch { currentCallPartner = null; pendingOffer = null; return; }

      localVideo.srcObject = localStream;
      callPanel.classList.remove('hidden');

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach((track) => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit('ice-candidate', { to: currentCallPartner, candidate: event.candidate });
      };

      await peerConnection.setRemoteDescription(pendingOffer.offer);
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer-call', { to: currentCallPartner, answer });
      pendingOffer = null;
    };

    rejectCallBtn.onclick = () => {
      incomingCallEl.classList.add('hidden');
      if (pendingOffer) socket.emit('end-call', { to: pendingOffer.from });
      pendingOffer = null;
    };

    socket.on('call-answered', async ({ answer }) => {
      if (peerConnection) await peerConnection.setRemoteDescription(answer);
    });

    socket.on('ice-candidate', async ({ candidate }) => {
      if (peerConnection) { try { await peerConnection.addIceCandidate(candidate); } catch {} }
    });

    socket.on('call-ended', () => endCall());

    hangupBtn.onclick = () => {
      if (currentCallPartner) socket.emit('end-call', { to: currentCallPartner });
      endCall();
    };

    function endCall() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      callPanel.classList.add('hidden');
      currentCallPartner = null;
    }
  </script>
</body>
</html>
